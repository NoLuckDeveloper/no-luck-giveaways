services:
  - type: worker
    name: mythics-gathering-giveaway-bot
    env: node
    buildCommand: npm install
    startCommand: node src/index.js
    # A background worker stays awake around the clock so timed draws and
    # milestone joins are never missed. Workers are not on Render's free tier.
    plan: starter
    # Persistent disk: giveaways and their state live in a JSON file, so the
    # data file must survive restarts and redeploys. The disk is mounted at
    # /data and GIVEAWAY_DB_PATH points there.
    disk:
      name: giveaway-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GIVEAWAY_DB_PATH
        value: /data/giveaways.json
      # Set these two in the Render dashboard (never in this file):
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      # No GUILD_ID: commands are registered globally, so the bot works in
      # every server it is added to. If GUILD_ID is still set from the old
      # single-server setup, it is ignored (except by the one-time data
      # migration in src/db.js, which uses it only to attribute legacy rows
      # saved without a guild_id).
